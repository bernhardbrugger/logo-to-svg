[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logo-to-svg"
dynamic = ["version"]
description = "Turn blurry raster logos into clean, scalable SVGs: trace the graphic with potrace, re-set the text as paths. Free and open source."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "bernhardbrugger" }]
keywords = ["svg", "logo", "vectorize", "potrace", "raster-to-vector", "claude-skill"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "potracer>=0.0.4",
    "opencv-python-headless>=4.8",
    "pillow>=10",
    "numpy>=1.24",
    "fonttools>=4.40",
    "brotli>=1.1",
]

[project.optional-dependencies]
preview = ["cairosvg>=2.7"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/bernhardbrugger/logo-to-svg"
Issues = "https://github.com/bernhardbrugger/logo-to-svg/issues"

[project.scripts]
logo-to-svg = "logo_to_svg.cli:main"

[tool.setuptools]
packages = ["logo_to_svg"]

[tool.setuptools.dynamic]
version = { attr = "logo_to_svg.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
